<?xml version="1.0"?>
<!-- Twin-stick layout for an Xbox 360 pad driving Virtual-On P1.

Why this exists: VOOT's twin sticks default to keyboard-only in MAME
(P1 left stick E/D/S/F, right stick I/K/J/L; see CORE_INPUT_TYPES_P1 in
src/emu/inpttype.ipp), and every scripted run starts from a blank
cfg_directory, so the pad mapping had to be redone by hand each time.
This controller profile is applied with
  -ctrlr x360twin -ctrlrpath <repo>/ctrlr
and survives fresh cfg directories. Per-run Tab-menu edits still work
on top of it.

Pad layout (SDL raw joystick 1; xpad driver):
  left stick X/Y   -> P1 left stick
  right stick RX/RY -> P1 right stick
  LB / RB          -> P1 Left Shot / P1 Right Shot (BUTTON1 / BUTTON3)
  LT / RT          -> P1 Left Dash / P1 Right Dash (BUTTON2 / BUTTON4)
                     via Z/RZ axis positive halves; needs most of the
                     trigger pull on the xpad driver
  Start / Back     -> P1 Start / P1 coin (SELECT)
P1 keyboard defaults are kept as OR fallbacks, so keyboard play and
existing input playbacks are unaffected. P2 is untouched: in twin
link runs the second cabinet is driven over the comm link, not by a
second local mapping.

Token shapes verified against this tree: input type tokens
P1_JOYSTICKLEFT_UP etc. (src/emu/inpttype.ipp macro), axis-switch
codes JOYCODE_1_XAXIS_LEFT_SWITCH (src/emu/input.cpp code_to_token),
1-based button codes JOYCODE_1_BUTTON5 (src/emu/input.cpp item table
+ src/osd/modules/input/input_sdlcommon.cpp), OR separator
(src/emu/input.cpp seq_from_tokens), tagless <port> applying to
type defaults (src/emu/ioport.cpp load_controller_config).
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_JOYSTICKLEFT_UP">
                <newseq type="standard">JOYCODE_1_YAXIS_UP_SWITCH OR KEYCODE_E</newseq>
            </port>
            <port type="P1_JOYSTICKLEFT_DOWN">
                <newseq type="standard">JOYCODE_1_YAXIS_DOWN_SWITCH OR KEYCODE_D</newseq>
            </port>
            <port type="P1_JOYSTICKLEFT_LEFT">
                <newseq type="standard">JOYCODE_1_XAXIS_LEFT_SWITCH OR KEYCODE_S</newseq>
            </port>
            <port type="P1_JOYSTICKLEFT_RIGHT">
                <newseq type="standard">JOYCODE_1_XAXIS_RIGHT_SWITCH OR KEYCODE_F</newseq>
            </port>
            <port type="P1_JOYSTICKRIGHT_UP">
                <newseq type="standard">JOYCODE_1_RYAXIS_UP_SWITCH OR KEYCODE_I</newseq>
            </port>
            <port type="P1_JOYSTICKRIGHT_DOWN">
                <newseq type="standard">JOYCODE_1_RYAXIS_DOWN_SWITCH OR KEYCODE_K</newseq>
            </port>
            <port type="P1_JOYSTICKRIGHT_LEFT">
                <newseq type="standard">JOYCODE_1_RXAXIS_LEFT_SWITCH OR KEYCODE_J</newseq>
            </port>
            <port type="P1_JOYSTICKRIGHT_RIGHT">
                <newseq type="standard">JOYCODE_1_RXAXIS_RIGHT_SWITCH OR KEYCODE_L</newseq>
            </port>
            <port type="P1_BUTTON1">
                <newseq type="standard">JOYCODE_1_BUTTON5 OR KEYCODE_LCONTROL</newseq>
            </port>
            <port type="P1_BUTTON2">
                <newseq type="standard">JOYCODE_1_ZAXIS_POS_SWITCH OR KEYCODE_LALT</newseq>
            </port>
            <port type="P1_BUTTON3">
                <newseq type="standard">JOYCODE_1_BUTTON6 OR KEYCODE_SPACE</newseq>
            </port>
            <port type="P1_BUTTON4">
                <newseq type="standard">JOYCODE_1_RZAXIS_POS_SWITCH OR KEYCODE_LSHIFT</newseq>
            </port>
            <port type="P1_START">
                <newseq type="standard">JOYCODE_1_BUTTON8 OR KEYCODE_1</newseq>
            </port>
            <port type="P1_SELECT">
                <newseq type="standard">JOYCODE_1_BUTTON7 OR KEYCODE_5</newseq>
            </port>
        </input>
    </system>
</mameconfig>
