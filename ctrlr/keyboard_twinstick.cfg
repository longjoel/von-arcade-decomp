<?xml version="1.0"?>
<!-- Keyboard-encoder twin-stick layout for Virtual-On P1.

Left stick: W/A/S/D, Q trigger, E boost
Right stick: I/J/K/L, U trigger, O boost
Coin/Start retain MAME's conventional 5/1 keys.
-->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_JOYSTICKLEFT_UP"><newseq type="standard">KEYCODE_W</newseq></port>
            <port type="P1_JOYSTICKLEFT_DOWN"><newseq type="standard">KEYCODE_S</newseq></port>
            <port type="P1_JOYSTICKLEFT_LEFT"><newseq type="standard">KEYCODE_A</newseq></port>
            <port type="P1_JOYSTICKLEFT_RIGHT"><newseq type="standard">KEYCODE_D</newseq></port>
            <port type="P1_JOYSTICKRIGHT_UP"><newseq type="standard">KEYCODE_I</newseq></port>
            <port type="P1_JOYSTICKRIGHT_DOWN"><newseq type="standard">KEYCODE_K</newseq></port>
            <port type="P1_JOYSTICKRIGHT_LEFT"><newseq type="standard">KEYCODE_J</newseq></port>
            <port type="P1_JOYSTICKRIGHT_RIGHT"><newseq type="standard">KEYCODE_L</newseq></port>
            <port type="P1_BUTTON1"><newseq type="standard">KEYCODE_Q</newseq></port>
            <port type="P1_BUTTON2"><newseq type="standard">KEYCODE_E</newseq></port>
            <port type="P1_BUTTON3"><newseq type="standard">KEYCODE_U</newseq></port>
            <port type="P1_BUTTON4"><newseq type="standard">KEYCODE_O</newseq></port>
            <port type="P1_START"><newseq type="standard">KEYCODE_1</newseq></port>
            <port type="P1_SELECT"><newseq type="standard">KEYCODE_5</newseq></port>
        </input>
    </system>
</mameconfig>
